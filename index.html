<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Recording Session</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, Arial; background-color: #f3f4f6; }
        .recording-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Google Apps Script URL
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzr_3jGloRfLHEO2quk58oFtzLaetsiUY05UcG0jNecyoDq0b68dyKXLql7iQ9xLdPnkQ/exec";

        // Scientifically reduced list focusing on critical phonetic environments (/i/, /u/, /a/)
        // Total: 26 items (approx. 3-5 minutes recording time)
        const sentences = [
            // Part 1: Everyday & Filler sentences
            { id: 1, text: "Այսօր եղանակը շատ լավն է։" },
            { id: 2, text: "Այդ ջուրը սառն է, հիմա խմի՛ր։" },
            { id: 3, text: "Կատուն քնած է բազմոցին։" }
        ];

        const convertToWav = async (audioBlob) => {
            const arrayBuffer = await audioBlob.arrayBuffer();
            const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

            const numOfChan = audioBuffer.numberOfChannels;
            const length = audioBuffer.length * numOfChan * 2;
            const buffer = new ArrayBuffer(44 + length);
            const view = new DataView(buffer);
            const channels = [];
            let sampleRate = audioContext.sampleRate;
            let offset = 0;
            let pos = 0;

            const setUint16 = (data) => { view.setUint16(offset, data, true); offset += 2; };
            const setUint32 = (data) => { view.setUint32(offset, data, true); offset += 4; };

            setUint32(0x46464952); 
            setUint32(36 + length);
            setUint32(0x45564157); 
            setUint32(0x20746d66); 
            setUint32(16);
            setUint16(1);
            setUint16(numOfChan);
            setUint32(sampleRate);
            setUint32(sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2);
            setUint16(16);
            setUint32(0x61746164); 
            setUint32(length);

            for (let i = 0; i < audioBuffer.numberOfChannels; i++) {
                channels.push(audioBuffer.getChannelData(i));
            }

            while (pos < audioBuffer.length) {
                for (let i = 0; i < numOfChan; i++) {
                    let sample = Math.max(-1, Math.min(1, channels[i][pos]));
                    sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(offset, sample, true);
                    offset += 2;
                }
                pos++;
            }

            return new Blob([buffer], { type: "audio/wav" });
        };

        const blobToBase64 = (blob) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        };

        const RecordingItem = ({ item, onSaveAudio, savedAudioUrl, onError }) => {
            const [isRecording, setIsRecording] = React.useState(false);
            const [audioUrl, setAudioUrl] = React.useState(savedAudioUrl || null);
            const [isPlaying, setIsPlaying] = React.useState(false);
            const [localError, setLocalError] = React.useState(null);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);
            const audioRef = React.useRef(null);

            React.useEffect(() => {
                setAudioUrl(savedAudioUrl);
            }, [savedAudioUrl]);

            const startRecording = async () => {
                setLocalError(null);
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        throw new Error("MediaDevices API not supported.");
                    }

                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            audioChunksRef.current.push(event.data);
                        }
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const url = URL.createObjectURL(audioBlob);
                        setAudioUrl(url);
                        onSaveAudio(item.id, audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                } catch (error) {
                    console.error("Error accessing microphone:", error);
                    setLocalError("⚠️ Microphone access blocked by browser security. Please run on localhost or HTTPS.");
                    if (onError) onError("Microphone Error", "Microphone access was denied.");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const togglePlayback = () => {
                if (!audioUrl) return;
                if (isPlaying) {
                    audioRef.current.pause();
                    audioRef.current.currentTime = 0;
                    setIsPlaying(false);
                } else {
                    audioRef.current.play();
                    setIsPlaying(true);
                }
            };

            return (
                <div className="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-4 transition-all hover:shadow-md">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div className="flex-1">
                            <span className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Item {item.id}</span>
                            <p className="text-xl font-medium text-gray-800 mt-1">{item.text}</p>
                        </div>
                        <div className="flex items-center gap-3">
                            {audioUrl && (
                                <button 
                                    onClick={togglePlayback}
                                    className={`w-10 h-10 rounded-full flex items-center justify-center transition-colors ${isPlaying ? 'bg-blue-100 text-blue-600' : 'bg-gray-100 text-gray-600 hover:bg-blue-50 hover:text-blue-500'}`}
                                    title="Play/Stop"
                                >
                                    <i className={`fas ${isPlaying ? 'fa-stop' : 'fa-play'}`}></i>
                                </button>
                            )}
                            
                            {!isRecording ? (
                                <button 
                                    onClick={startRecording}
                                    className="px-4 py-2 bg-red-50 text-red-600 rounded-full font-medium hover:bg-red-100 transition-colors flex items-center gap-2 border border-red-200"
                                >
                                    <i className="fas fa-microphone"></i>
                                    {audioUrl ? 'Re-record' : 'Record'}
                                </button>
                            ) : (
                                <button 
                                    onClick={stopRecording}
                                    className="px-4 py-2 bg-red-500 text-white rounded-full font-medium hover:bg-red-600 transition-colors flex items-center gap-2 recording-pulse"
                                >
                                    <i className="fas fa-stop"></i>
                                    Stop
                                </button>
                            )}
                        </div>
                    </div>
                    {localError && (
                        <div className="mt-3 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-md font-medium">
                            {localError}
                        </div>
                    )}
                    {audioUrl && <audio ref={audioRef} src={audioUrl} onEnded={() => setIsPlaying(false)} className="hidden" />}
                </div>
            );
        };

        const App = () => {
            const [demographics, setDemographics] = React.useState({
                participantId: '',
                birthYear: '',
                gender: ''
            });

            const [audioBlobs, setAudioBlobs] = React.useState({});
            const [isUploading, setIsUploading] = React.useState(false);
            const [uploadProgress, setUploadProgress] = React.useState(0);
            const [uploadStatus, setUploadStatus] = React.useState({ type: '', message: '' });

            const recordedCount = Object.keys(audioBlobs).length;
            const progressPercentage = Math.round((recordedCount / sentences.length) * 100);

            const handleDemoChange = (e) => {
                setDemographics({ ...demographics, [e.target.name]: e.target.value });
            };

            const saveAudio = (id, blob) => {
                setAudioBlobs(prev => ({ ...prev, [id]: blob }));
            };

            const submitToDrive = async () => {
                if (!demographics.participantId) {
                    alert("Participant ID is required.");
                    return;
                }
                if (recordedCount === 0) {
                    alert("No recordings found.");
                    return;
                }

                setIsUploading(true);
                setUploadStatus({ type: 'info', message: 'Converting to WAV and creating ZIP...' });
                setUploadProgress(10);

                try {
                    const zip = new JSZip();
                    const partId = demographics.participantId.replace(/[^a-z0-9]/gi, '_');

                    const conversionPromises = Object.entries(audioBlobs).map(async ([id, blob]) => {
                        try {
                            const wavBlob = await convertToWav(blob);
                            zip.file(`${partId}_item_${id.padStart(2, '0')}.wav`, wavBlob);
                        } catch (e) {
                            console.error("WAV conversion failed for id", id, e);
                            zip.file(`${partId}_item_${id.padStart(2, '0')}_fallback.webm`, blob);
                        }
                    });

                    await Promise.all(conversionPromises);
                    setUploadProgress(40);

                    const demoText = `=== Participant Demographics ===
ID: ${demographics.participantId}
Year of Birth: ${demographics.birthYear}
Gender: ${demographics.gender}
City: ${demographics.city}
Country: ${demographics.country}
Dialect: ${demographics.dialect}
Native Language: ${demographics.nativeLanguage}
Other Languages: ${demographics.otherLanguages}
Years outside home: ${demographics.yearsOutside}
Speech Disorder: ${demographics.speechDisorder}
================================`;
                    zip.file(`${partId}_demographics.txt`, demoText);

                    setUploadStatus({ type: 'info', message: 'Compressing data...' });
                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    setUploadProgress(70);

                    const base64Data = await blobToBase64(zipBlob);

                    setUploadStatus({ type: 'info', message: 'Sending to Google Drive...' });
                    
                    const payload = {
                        filename: `${partId}_audio_data.zip`,
                        mimeType: 'application/zip',
                        data: base64Data
                    };

                    const response = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                        headers: { 'Content-Type': 'text/plain' } 
                    });

                    const result = await response.json();

                    if (result.success) {
                        setUploadProgress(100);
                        setUploadStatus({ type: 'success', message: '✅ Successfully sent to Google Drive! Thank you for your cooperation.' });
                    } else {
                        throw new Error(result.error);
                    }

                } catch (error) {
                    console.error("Upload error:", error);
                    setUploadStatus({ type: 'error', message: `❌ Upload Error: ${error.message}` });
                } finally {
                    setIsUploading(false);
                }
            };

            return (
                <div className="min-h-screen pb-20">
                    <div className="bg-slate-800 text-white pt-10 pb-16 px-4">
                        <div className="max-w-4xl mx-auto">
                            <h1 className="text-3xl font-bold mb-2">Voice Recording Session</h1>
                            <p className="text-slate-300">Linguistic Study</p>
                            
                            <div className="mt-4 text-sm text-slate-400 bg-slate-800/50 p-4 rounded-lg border border-slate-600">
                            <p className="font-semibold text-slate-200 mb-1">Researcher Information</p>
                            <p>Name: Takuya Inoue</p>
                            <p>Affiliation: Ritsumeikan University Language Education Center</p>
                            <p>Contact: <a href="mailto:takinoue@pep-rg.jp" className="text-blue-400 hover:underline">takinoue@pep-rg.jp</a></p>
                        </div>

                        {}
                        <div className="mt-8 bg-amber-900/30 rounded-xl p-6 border border-amber-700">
                            <h2 className="text-xl font-semibold mb-4 text-amber-300">
                                <i className="fas fa-exclamation-triangle mr-2"></i>Acoustic Environment Checklist
                            </h2>
                            <p className="text-sm text-slate-300 mb-4">
                                This research analyzes subtle acoustic features. Background noise or poor recording quality will make the data unusable. 
                                <br/><strong>Please check the following boxes before proceeding:</strong>
                            </p>
                            <div className="space-y-3 text-sm text-slate-300">
                                <label className="flex items-start gap-3 cursor-pointer p-2 hover:bg-slate-700/50 rounded">
                                    <input type="checkbox" className="mt-1 w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" required />
                                    <span><strong>Quiet Room:</strong> I am in a quiet private room without other people, pets, or TV noise.</span>
                                </label>
                                <label className="flex items-start gap-3 cursor-pointer p-2 hover:bg-slate-700/50 rounded">
                                    <input type="checkbox" className="mt-1 w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" required />
                                    <span><strong>AC/Fans OFF:</strong> I have temporarily turned off air conditioners, fans, or air purifiers.</span>
                                </label>
                                <label className="flex items-start gap-3 cursor-pointer p-2 hover:bg-slate-700/50 rounded">
                                    <input type="checkbox" className="mt-1 w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" required />
                                    <span><strong>Device Placement:</strong> My device is placed on a desk, approximately 15-20 cm away from my mouth, slightly to the side to prevent breathing noise.</span>
                                </label>
                            </div>
                        </div>

                        <div className="mt-6 bg-blue-900/30 rounded-xl p-6 border border-blue-700">
                            <h2 className="text-xl font-semibold mb-3 text-blue-300">
                                <i className="fas fa-info-circle mr-2"></i>Instructions for the Speaker
                            </h2>
                                <ul className="list-disc list-outside ml-5 text-slate-300 space-y-2 text-sm">
                                    <li>Please read the sentences naturally, at a <strong>normal, conversational speed</strong>.</li>
                                    <li>Some sentences contain made-up words (non-words) inserted for linguistic testing purposes (e.g., "միր", "լուրի", "մուր"). Please just read them naturally as they are written.</li>
                                    <li>Read each sentence clearly, but do not over-emphasize or stress any specific words unless they feel natural to you.</li>
                                    <li>Please pause briefly between sentences.</li>
                                    <li>For items marked <strong>(Fast)</strong>, please read them <strong>as fast as you naturally can</strong>.</li>
                                </ul>
                            </div>

                            <div className="mt-8 bg-slate-700/50 rounded-xl p-6 border border-slate-600">
                                <h2 className="text-xl font-semibold mb-4 text-blue-300"><i className="fas fa-user-circle mr-2"></i>Demographic Questionnaire</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm text-slate-300 mb-1">Participant ID / Code (Required)*</label>
                                        <input type="text" name="participantId" value={demographics.participantId} onChange={handleDemoChange} className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="e.g. P001" required />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-slate-300 mb-1">Year of Birth</label>
                                        <input type="text" name="birthYear" value={demographics.birthYear} onChange={handleDemoChange} className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="YYYY" />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-slate-300 mb-1">Gender</label>
                                        <select name="gender" value={demographics.gender} onChange={handleDemoChange} className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                                            <option value="">Select...</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                            <option value="Prefer not to say">Prefer not to say</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm text-slate-300 mb-1">Armenian Dialect</label>
                                        <select name="dialect" value={demographics.dialect} onChange={handleDemoChange} className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                                            <option value="">Select...</option>
                                            <option value="Eastern">Eastern (e.g. Armenia, Iran)</option>
                                            <option value="Western">Western (e.g. Lebanon, Syria)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm text-slate-300 mb-1">City / Town of Origin</label>
                                        <input type="text" name="city" value={demographics.city} onChange={handleDemoChange} className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="e.g. Yerevan" />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-slate-300 mb-1">Country of Origin</label>
                                        <input type="text" name="country" value={demographics.country} onChange={handleDemoChange} className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="e.g. Armenia" />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-slate-300 mb-1">Native Language(s)</label>
                                        <input type="text" name="nativeLanguage" value={demographics.nativeLanguage} onChange={handleDemoChange} className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="e.g. Armenian" />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-slate-300 mb-1">Other Languages Spoken</label>
                                        <input type="text" name="otherLanguages" value={demographics.otherLanguages} onChange={handleDemoChange} className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="e.g. English, Russian" />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-slate-300 mb-1">Years living outside home region</label>
                                        <input type="number" name="yearsOutside" value={demographics.yearsOutside} onChange={handleDemoChange} className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="e.g. 5" />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-slate-300 mb-1">History of speech/hearing disorders?</label>
                                        <select name="speechDisorder" value={demographics.speechDisorder} onChange={handleDemoChange} className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                                            <option value="">Select...</option>
                                            <option value="No">No</option>
                                            <option value="Yes">Yes</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-4xl mx-auto px-4 -mt-8 relative z-10">
                        <div className="bg-white rounded-xl shadow-lg p-6 mb-8 border border-gray-100">
                            <div className="flex justify-between items-end mb-2">
                                <div>
                                    <h2 className="text-lg font-bold text-gray-800">Recording Progress</h2>
                                    <p className="text-sm text-gray-500">{recordedCount} of {sentences.length} items recorded</p>
                                </div>
                                <div className="text-2xl font-bold text-blue-600">{progressPercentage}%</div>
                            </div>
                            <div className="w-full bg-gray-200 rounded-full h-3">
                                <div className="bg-blue-600 h-3 rounded-full transition-all duration-500" style={{ width: `${progressPercentage}%` }}></div>
                            </div>
                        </div>

                        {}
                        <div className="space-y-2">
                            {React.useMemo(() => {
                                // Randomize the array on mount to prevent order bias
                                return [...sentences].sort(() => Math.random() - 0.5);
                            }, []).map((item) => (
                                <RecordingItem 
                                    key={item.id} 
                                    item={item} 
                                    onSaveAudio={saveAudio} 
                                    savedAudioUrl={audioBlobs[item.id] ? URL.createObjectURL(audioBlobs[item.id]) : null}
                                />
                            ))}
                        </div>

                        <div className="mt-12 bg-white rounded-xl shadow-lg p-8 border border-gray-100 text-center">
                            <h2 className="text-2xl font-bold text-gray-800 mb-4">Submit Session Data</h2>
                            <p className="text-gray-600 mb-6">Once all recordings are complete, please click the button below to submit your data to the researcher's Google Drive.</p>
                            
                            {uploadStatus.message && (
                                <div className={`mb-6 p-4 rounded-lg font-medium text-left ${uploadStatus.type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : uploadStatus.type === 'success' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-blue-50 text-blue-700 border border-blue-200'}`}>
                                    {uploadStatus.message}
                                </div>
                            )}

                            <button 
                                onClick={submitToDrive}
                                disabled={isUploading || recordedCount === 0}
                                className={`px-8 py-4 rounded-full font-bold text-lg text-white shadow-lg transition-all flex items-center justify-center gap-3 mx-auto ${isUploading || recordedCount === 0 ? 'bg-gray-400 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700 hover:shadow-xl hover:-translate-y-1'}`}
                            >
                                {isUploading ? (
                                    <><i className="fas fa-spinner fa-spin"></i> Processing & Sending ({uploadProgress}%)</>
                                ) : (
                                    <><i className="fab fa-google-drive"></i> Submit to Drive</>
                                )}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
